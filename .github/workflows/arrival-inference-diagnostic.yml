name: Arrival inference diagnostic
on:
  push:
    branches:
      - resolver-engine-v0
    paths:
      - "scripts/diagnose-arrival-inference-v0.mjs"
      - "scripts/infer-development-arrival-direction-v1.mjs"
      - "scripts/infer-development-arrival-direction-v2.mjs"
      - "docs/historical-landing-direction-inference-policy-v2.md"
      - "docs/historical-landing-direction-inference-policy-v1.md"
      - ".github/workflows/arrival-inference-diagnostic.yml"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: node scripts/diagnose-arrival-inference-v0.mjs
      - run: node scripts/infer-development-arrival-direction-v1.mjs
      - run: node scripts/infer-development-arrival-direction-v2.mjs
