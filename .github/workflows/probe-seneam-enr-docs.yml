name: Probe SENEAM official ENR documents
on:
  push:
    branches: [resolver-engine-v0]
    paths:
      - "scripts/probe-seneam-enr-docs.mjs"
      - ".github/workflows/probe-seneam-enr-docs.yml"
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - run: node scripts/probe-seneam-enr-docs.mjs
