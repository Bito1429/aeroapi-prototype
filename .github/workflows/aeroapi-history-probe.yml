name: AeroAPI history probe
on:
  push:
    branches: [resolver-engine-v0]
    paths:
      - "scripts/probe-aeroapi-history.mjs"
      - ".github/workflows/aeroapi-history-probe.yml"
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/probe-aeroapi-history.mjs
        env:
          AEROAPI_KEY: ${{ secrets.AEROAPI_KEY }}
