name: Chester 23 Nov AA1776 date-only regression
on:
  push:
    branches:
      - fix/aa1776-chester-23nov-rehearsal
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test tests/aa1776-chester-relay.test.mjs
      - run: node --check chester-standalone/source/lib/aa1776-relay.js
      - name: Test isolated four-endpoint build
        working-directory: chester-standalone
        run: |
          npm install --no-audit --no-fund
          npm run build
          test -s api/chester-aa1776.js
