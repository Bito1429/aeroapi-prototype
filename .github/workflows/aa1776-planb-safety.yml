name: AA1776 Plan B safety unit tests
on:
  push:
    branches:
      - feature/aa1776-planb-isolated-20261120
      - release/aa1776-planb-us-isolated-20261120
  workflow_dispatch:
jobs:
  safety:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --check api/aa1776-policy.js
      - run: node --check api/aa1776-planb.js
      - run: node --test tests/aa1776-policy.test.mjs
